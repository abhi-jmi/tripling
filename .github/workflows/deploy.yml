name: Test and deploy Tripling
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tripling-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  test:
    name: MongoDB and application checks
    # MongoDB 8.0 rejects the 6.19+ kernel on the current ubuntu-latest image.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Start MongoDB replica set
        run: |
          trap 'docker logs --tail 80 tripling-mongo; docker inspect --format "{{json .State}}" tripling-mongo' ERR
          docker run -d --name tripling-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet tripling-rs --bind_ip_all
          for attempt in {1..30}; do
            if docker exec tripling-mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec tripling-mongo mongosh --quiet --eval 'rs.initiate({_id:"tripling-rs",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in {1..30}; do
            if docker exec tripling-mongo mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start read-only PostgreSQL transfer test source
        run: |
          docker run -d --name tripling-transfer-source -p 127.0.0.1:5432:5432 -e POSTGRES_USER=tripling -e POSTGRES_PASSWORD=local-test-only -e POSTGRES_DB=tripling_transfer_test postgres:17-bookworm
          for attempt in {1..30}; do
            if docker exec tripling-transfer-source pg_isready -U tripling -d tripling_transfer_test; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=tripling-rs
          TEST_MONGODB_DATABASE: tripling_test
          PG_SOURCE_TEST_URI: postgres://tripling:local-test-only@127.0.0.1:5432/tripling_transfer_test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'cfn-lint==1.60.0'
      - run: cfn-lint infra/*.yaml
      - run: bash -n scripts/deploy-aws.sh scripts/deploy-release.sh scripts/deploy-foundation.sh scripts/foundation-template.sh scripts/check-mongodb-aws.sh scripts/preflight-mongodb-aws.sh scripts/cutover-mongodb-aws.sh scripts/reopen-mongodb-aws.sh
  configuration:
    name: Check deployment connection
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          DEPLOY_REGION: ${{ vars.AWS_REGION }}
          EXPECTED_ACCOUNT: "669991883783"
        run: |
          if [[ -z "$DEPLOY_ROLE" || -z "$DEPLOY_REGION" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '### AWS deployment is not connected' >> "$GITHUB_STEP_SUMMARY"
            echo 'Tests will run, but deployment is skipped until AWS_DEPLOY_ROLE_ARN and AWS_REGION repository variables are configured. See docs/aws-deployment.md for the one-time setup.' >> "$GITHUB_STEP_SUMMARY"
          else
            [[ "$DEPLOY_ROLE" =~ ^arn:aws:iam::[0-9]{12}:role/.+ ]] || { echo 'Invalid AWS_DEPLOY_ROLE_ARN'; exit 1; }
            [[ "$DEPLOY_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]] || { echo 'Invalid AWS_REGION'; exit 1; }
            [[ "$DEPLOY_ROLE" == arn:aws:iam::${EXPECTED_ACCOUNT}:role/* ]] || { echo 'Role must belong to AWS account 669991883783'; exit 1; }
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    name: Release to AWS
    needs: [test, configuration]
    if: github.ref == 'refs/heads/main' && needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ACCOUNT_ID: "669991883783"
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_SERVICE_STACK: ${{ vars.AWS_SERVICE_STACK || 'tripling-service' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: Tripling-${{ github.run_id }}
      - run: ./scripts/deploy-release.sh
