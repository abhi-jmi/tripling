AWSTemplateFormatVersion: "2010-09-09"
Description: Tripling HTTPS frontend and API on ECS Fargate. No resources are created until explicitly deployed.
Parameters:
  FoundationStack:
    Type: String
    Default: tripling-foundation
  ImageTag:
    Type: String
    AllowedPattern: "[a-f0-9]{40}"
  CertificateArn:
    Type: String
    Description: Issued ACM certificate in this region for the application domain
    AllowedPattern: "arn:[a-z-]+:acm:[a-z0-9-]+:[0-9]{12}:certificate/.+"
  DomainName:
    Type: String
    Description: Application hostname covered by the certificate; point DNS to the load balancer after deployment
    AllowedPattern: '[a-zA-Z0-9][a-zA-Z0-9.-]+\.[a-zA-Z]{2,63}'
  LegalOperatorName:
    Type: String
    Description: Public legal operator or business name
    MinLength: 1
    MaxLength: 200
  LegalContactEmail:
    Type: String
    Default: abhishek@tripling.in
    Description: Monitored public support and privacy email
    AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'
  LegalJurisdiction:
    Type: String
    Default: Chandigarh, India
    Description: Public country and state of the operator
    MinLength: 1
    MaxLength: 200
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PullApplicationAndWriteLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  [
                    ecr:BatchGetImage,
                    ecr:GetDownloadUrlForLayer,
                    ecr:BatchCheckLayerAvailability,
                  ]
                Resource:
                  Fn::ImportValue: !Sub "${FoundationStack}-RepositoryArn"
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
  ApplicationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadDatabaseCredentials
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::ImportValue: !Sub "${FoundationStack}-DatabaseSecretArn"
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP redirect and HTTPS only
      VpcId:
        Fn::ImportValue: !Sub "${FoundationStack}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          DestinationSecurityGroupId:
            Fn::ImportValue: !Sub "${FoundationStack}-ApplicationSecurityGroup"
  ApplicationIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId:
        Fn::ImportValue: !Sub "${FoundationStack}-ApplicationSecurityGroup"
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets:
        - Fn::ImportValue: !Sub "${FoundationStack}-PublicSubnetA"
        - Fn::ImportValue: !Sub "${FoundationStack}-PublicSubnetB"
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: routing.http.desync_mitigation_mode
          Value: strictest
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: HTTP
      Port: 3000
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${FoundationStack}-VpcId"
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 30
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "20"
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-app"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApplicationRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: tripling
          Essential: true
          Image:
            Fn::Join:
              - ":"
              - - Fn::ImportValue: !Sub "${FoundationStack}-RepositoryUri"
                - !Ref ImageTag
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: APP_VERSION
              Value: !Ref ImageTag
            - Name: LEGAL_OPERATOR_NAME
              Value: !Ref LegalOperatorName
            - Name: LEGAL_CONTACT_EMAIL
              Value: !Ref LegalContactEmail
            - Name: LEGAL_JURISDICTION
              Value: !Ref LegalJurisdiction
            - Name: PORT
              Value: "3000"
            - Name: PUBLIC_ORIGIN
              Value: !Sub "https://${DomainName}"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DB_HOST
              Value:
                Fn::ImportValue: !Sub "${FoundationStack}-DatabaseHost"
            - Name: DB_NAME
              Value: tripling
            - Name: DB_SECRET_ARN
              Value:
                Fn::ImportValue: !Sub "${FoundationStack}-DatabaseSecretArn"
            - Name: DB_SSL_CA
              Value: /app/certs/global-bundle.pem
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-region: !Ref AWS::Region
              awslogs-group: !Ref LogGroup
              awslogs-stream-prefix: tripling
          HealthCheck:
            Command:
              [
                CMD-SHELL,
                'node -e "fetch(\"http://127.0.0.1:3000/healthz\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
              ]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpsListener, ApplicationIngress]
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 120
      EnableECSManagedTags: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub "${FoundationStack}-ApplicationSecurityGroup"
          Subnets:
            - Fn::ImportValue: !Sub "${FoundationStack}-PrivateSubnetA"
            - Fn::ImportValue: !Sub "${FoundationStack}-PrivateSubnetB"
      LoadBalancers:
        - ContainerName: tripling
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
  ScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 3
      MinCapacity: 1
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "${AWS::StackName}-cpu"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 70
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 180
        ScaleOutCooldown: 60
Outputs:
  WebsiteUrl:
    Value: !Sub "https://${DomainName}"
  DnsTarget:
    Description: Create a DNS alias or CNAME from the application hostname to this load balancer
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  ClusterArn:
    Value: !GetAtt Cluster.Arn
  ServiceArn:
    Value: !Ref Service
    Export:
      Name: !Sub "${AWS::StackName}-ServiceArn"
  TaskExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-TaskExecutionRoleArn"
  ApplicationRoleArn:
    Value: !GetAtt ApplicationRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ApplicationRoleArn"
  LoadBalancerDns:
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerDns"
  LoadBalancerZone:
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub "${AWS::StackName}-LoadBalancerZone"
