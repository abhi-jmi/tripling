services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: tripling
      POSTGRES_USER: tripling
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - tripling_db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripling -d tripling"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgres://tripling:local-development-only@db:5432/tripling
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  tripling_db:
